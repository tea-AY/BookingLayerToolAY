<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Yogi - Retreat Marketing Planner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .task-card {
            transition: all 0.3s ease;
        }
        
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Default Marketing Tasks
        const DEFAULT_TASKS = {
            pre_launch: [
                {
                    id: 'pl1',
                    name: "🎥 Create 'Yogi Stories' content",
                    channels: ['Instagram', 'Facebook'],
                    days_before: 60,
                    description: "Record authentic guest voices about why they came on retreat",
                    pillar: 'EXPLORE'
                },
                {
                    id: 'pl2',
                    name: "📸 Prepare 'Local Stories' content",
                    channels: ['Instagram', 'Facebook', 'Email', 'Website'],
                    days_before: 55,
                    description: "Showcase myths, legends and local traditions",
                    pillar: 'EXPLORE'
                },
                {
                    id: 'pl3',
                    name: "🍽️ Create 'Food for Soul' post",
                    channels: ['Instagram', 'Email', 'Website'],
                    days_before: 50,
                    description: "Feature plant-based meals with recipes",
                    pillar: 'ALIGN'
                },
                {
                    id: 'pl4',
                    name: "📧 Early Bird Email Campaign",
                    channels: ['Email'],
                    days_before: 45,
                    description: "Launch early bird offer",
                    pillar: 'SELL'
                }
            ],
            launch: [
                {
                    id: 'l1',
                    name: "🌟 Social Media Announcements",
                    channels: ['Instagram', 'Facebook'],
                    days_before: 35,
                    description: "Announce retreat with key details",
                    pillar: 'SELL'
                }
            ],
            ongoing: [
                {
                    id: 'o1',
                    name: "📱 Weekly Instagram Stories",
                    channels: ['Instagram'],
                    days_before: 30,
                    description: "Behind-the-scenes content",
                    pillar: 'EXPLORE'
                }
            ],
            final_push: [
                {
                    id: 'fp1',
                    name: "⏰ Last Chance Email",
                    channels: ['Email'],
                    days_before: 7,
                    description: "Final call for bookings",
                    pillar: 'SELL'
                }
            ],
            post_retreat: [
                {
                    id: 'pr1',
                    name: "📸 Share Retreat Highlights",
                    channels: ['Instagram', 'Facebook'],
                    days_after: 3,
                    description: "Post photos and testimonials",
                    pillar: 'ALIGN'
                }
            ]
        };

        function App() {
            const [step, setStep] = useState('scrape'); // scrape, customize, generate
            const [retreats, setRetreats] = useState([]);
            const [selectedRetreats, setSelectedRetreats] = useState([]);
            const [tasks, setTasks] = useState(DEFAULT_TASKS);
            const [extracting, setExtracting] = useState(false);
            const [progress, setProgress] = useState('');

            // Extract retreats from current webpage
            const extractRetreats = () => {
                setExtracting(true);
                setProgress('Scanning webpage for retreat information...');

                try {
                    const extractedRetreats = [];
                    const locations = ['Cornwall','Devon','Wales','Scotland','France','Spain','Portugal','Morocco','Bali','Kenya','Costa Rica','Montenegro','Slovenia','Madeira','Marrakech','Sardinia','Alps','Peak District','Lake District','Brecon Beacons','Norfolk','Dorset','Yorkshire','Cotswolds','Almeria','Corfu','Essaouira','Atlas Mountains','Sweden','Greece','Italy'];
                    
                    const allElements = document.querySelectorAll('*');
                    
                    for (let i = 0; i < allElements.length; i++) {
                        const element = allElements[i];
                        const text = element.textContent || '';
                        
                        // Look for date patterns like "15th Jul - 22nd Jul 2025"
                        const dateMatch = text.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(\w{3,9})\s*-\s*(\d{1,2})(?:st|nd|rd|th)?\s+(\w{3,9})\s+(\d{4})/i);
                        
                        if (dateMatch) {
                            // Check for location
                            let location = '';
                            for (let j = 0; j < locations.length; j++) {
                                if (text.toLowerCase().includes(locations[j].toLowerCase())) {
                                    location = locations[j];
                                    break;
                                }
                            }
                            
                            if (location) {
                                // Find retreat name
                                let name = '';
                                const heading = element.querySelector('h1, h2, h3, h4, h5, h6');
                                if (heading) {
                                    name = heading.textContent.trim();
                                }
                                
                                if (!name) {
                                    const lines = text.split('\n');
                                    for (let k = 0; k < lines.length; k++) {
                                        const line = lines[k].trim();
                                        if (line.length > 10 && line.length < 150 && 
                                            (line.toLowerCase().includes('retreat') || 
                                             line.toLowerCase().includes('yoga') || 
                                             line.toLowerCase().includes('holiday') ||
                                             line.toLowerCase().includes('nights'))) {
                                            name = line;
                                            break;
                                        }
                                    }
                                }
                                
                                if (name) {
                                    // Convert dates
                                    const monthMap = {
                                        'Jan':'01','Feb':'02','Mar':'03','Apr':'04','May':'05','Jun':'06',
                                        'Jul':'07','Aug':'08','Sep':'09','Oct':'10','Nov':'11','Dec':'12',
                                        'January':'01','February':'02','March':'03','April':'04','May':'05','June':'06',
                                        'July':'07','August':'08','September':'09','October':'10','November':'11','December':'12'
                                    };
                                    
                                    const startDay = dateMatch[1].padStart(2, '0');
                                    const startMonthText = dateMatch[2];
                                    const endDay = dateMatch[3].padStart(2, '0');
                                    const endMonthText = dateMatch[4];
                                    const year = dateMatch[5];
                                    
                                    const startMonth = monthMap[startMonthText] || monthMap[startMonthText.substring(0,3)] || '01';
                                    const endMonth = monthMap[endMonthText] || monthMap[endMonthText.substring(0,3)] || '01';
                                    
                                    const startDate = `${startDay}/${startMonth}/${year}`;
                                    const endDate = `${endDay}/${endMonth}/${year}`;
                                    
                                    // Calculate duration
                                    const start = new Date(year, parseInt(startMonth)-1, parseInt(startDay));
                                    const end = new Date(year, parseInt(endMonth)-1, parseInt(endDay));
                                    const duration = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                                    
                                    // Classify type
                                    let retreat_type = 'Holiday';
                                    if (duration <= 3) retreat_type = 'Weekend';
                                    else if (duration <= 5) retreat_type = 'Mid-Week';
                                    
                                    // Check for duplicates
                                    const isDuplicate = extractedRetreats.some(r => 
                                        r.name === name && r.start_date === startDate
                                    );
                                    
                                    if (!isDuplicate) {
                                        extractedRetreats.push({
                                            id: `${name}_${startDate}`.replace(/[^a-zA-Z0-9]/g, '_'),
                                            name: name,
                                            start_date: startDate,
                                            end_date: endDate,
                                            location: location,
                                            duration: duration,
                                            retreat_type: retreat_type
                                        });
                                    }
                                }
                            }
                        }
                    }
                    
                    setProgress(`Found ${extractedRetreats.length} retreats!`);
                    
                    if (extractedRetreats.length === 0) {
                        alert('No retreats found on this page. Please navigate to the Adventure Yogi retreat calendar page and try again.');
                        setExtracting(false);
                        return;
                    }
                    
                    // Sort by date
                    extractedRetreats.sort((a, b) => {
                        const dateA = new Date(a.start_date.split('/').reverse().join('-'));
                        const dateB = new Date(b.start_date.split('/').reverse().join('-'));
                        return dateA - dateB;
                    });
                    
                    setRetreats(extractedRetreats);
                    setSelectedRetreats(extractedRetreats.map(r => r.id));
                    
                    setTimeout(() => {
                        setStep('customize');
                        setExtracting(false);
                    }, 1000);
                    
                } catch (err) {
                    alert('Error extracting retreats: ' + err.message);
                    setExtracting(false);
                }
            };

            const generateCSV = () => {
                const selectedRetreatsList = retreats.filter(r => selectedRetreats.includes(r.id));
                
                let csv = 'Name,Start Date,End Date,Notes,Tags\n';
                
                selectedRetreatsList.forEach(retreat => {
                    // Parse dates (DD/MM/YYYY format)
                    const [startDay, startMonth, startYear] = retreat.start_date.split('/');
                    const [endDay, endMonth, endYear] = retreat.end_date.split('/');
                    const startDate = new Date(startYear, startMonth - 1, startDay);
                    const endDate = new Date(endYear, endMonth - 1, endDay);
                    
                    const formatDate = (date) => {
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        const day = String(date.getDate()).padStart(2, '0');
                        const year = date.getFullYear();
                        return `${month}/${day}/${year}`;
                    };
                    
                    // Milestone row
                    const milestoneNotes = `Retreat: ${retreat.location} | ${retreat.retreat_type} (${retreat.duration} nights) | ${retreat.start_date} to ${retreat.end_date}`;
                    csv += `"🧘 ${retreat.name}","${formatDate(startDate)}","${formatDate(startDate)}","${milestoneNotes}","milestone,retreat,${retreat.retreat_type}"\n`;
                    
                    // Add tasks
                    Object.entries(tasks).forEach(([category, taskList]) => {
                        taskList.forEach(task => {
                            if (task.enabled === false) return;
                            
                            let dueDate;
                            if (task.days_before !== undefined) {
                                dueDate = new Date(startDate);
                                dueDate.setDate(dueDate.getDate() - task.days_before);
                            } else if (task.days_after !== undefined) {
                                dueDate = new Date(endDate);
                                dueDate.setDate(dueDate.getDate() + task.days_after);
                            } else {
                                dueDate = startDate;
                            }
                            
                            const channels = task.channels.join(', ');
                            const notes = `${retreat.name} (${retreat.retreat_type}) | ${task.description} | Channels: ${channels} | Pillar: ${task.pillar}`;
                            const tags = `${retreat.name},${task.pillar},${category},${retreat.retreat_type}`;
                            
                            csv += `"${task.name}","${formatDate(startDate)}","${formatDate(dueDate)}","${notes}","${tags}"\n`;
                        });
                    });
                });
                
                return csv;
            };

            const downloadCSV = () => {
                const csv = generateCSV();
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `adventure-yogi-retreats-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const Step = ({ number, label, active, completed }) => (
                <div className="flex flex-col items-center">
                    <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg ${
                        completed ? 'bg-green-500 text-white' : 
                        active ? 'bg-purple-600 text-white' : 
                        'bg-gray-300 text-gray-600'
                    }`}>
                        {completed ? '✓' : number}
                    </div>
                    <span className={`mt-2 text-sm font-medium ${active ? 'text-purple-600' : 'text-gray-500'}`}>
                        {label}
                    </span>
                </div>
            );

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <div className="gradient-bg text-white py-8 px-4">
                        <div className="max-w-7xl mx-auto">
                            <h1 className="text-4xl font-bold mb-2">🧘 Adventure Yogi</h1>
                            <p className="text-xl opacity-90">Retreat Marketing Planner</p>
                        </div>
                    </div>

                    {/* Progress Steps */}
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <div className="flex items-center justify-center space-x-4 mb-8">
                            <Step number="1" label="Extract" active={step === 'scrape'} completed={step !== 'scrape'} />
                            <div className="w-16 h-1 bg-gray-300"></div>
                            <Step number="2" label="Customize" active={step === 'customize'} completed={step === 'generate'} />
                            <div className="w-16 h-1 bg-gray-300"></div>
                            <Step number="3" label="Generate" active={step === 'generate'} />
                        </div>

                        {/* Step 1: Extract Retreats */}
                        {step === 'scrape' && (
                            <div className="max-w-2xl mx-auto">
                                <div className="bg-white rounded-lg shadow-lg p-8">
                                    <h2 className="text-2xl font-bold mb-4">📊 Extract Retreat Data</h2>
                                    <p className="text-gray-600 mb-6">
                                        This tool will scan the current webpage for Adventure Yogi retreat information.
                                    </p>

                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                                        <h3 className="font-semibold text-blue-900 mb-2">📋 Instructions:</h3>
                                        <ol className="text-sm text-blue-800 space-y-2 list-decimal list-inside">
                                            <li>Navigate to <strong>adventureyogi.com/yoga-holidays</strong></li>
                                            <li>Make sure retreat cards with dates and locations are visible</li>
                                            <li>Scroll down to load all retreats on the page</li>
                                            <li>Click "Extract Retreats" below</li>
                                        </ol>
                                    </div>

                                    {progress && (
                                        <div className="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded mb-4">
                                            {progress}
                                        </div>
                                    )}

                                    <button
                                        onClick={extractRetreats}
                                        disabled={extracting}
                                        className="w-full bg-purple-600 text-white py-4 px-6 rounded-lg hover:bg-purple-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed font-semibold text-lg"
                                    >
                                        {extracting ? '🔄 Extracting...' : '📊 Extract Retreats from This Page'}
                                    </button>

                                    <p className="text-xs text-gray-500 mt-4 text-center">
                                        This will analyze the current webpage and extract retreat details including dates, locations, and names.
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* Step 2: Customize */}
                        {step === 'customize' && (
                            <div className="max-w-4xl mx-auto">
                                <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                                    <h2 className="text-2xl font-bold mb-4">✅ Select Retreats</h2>
                                    <p className="text-gray-600 mb-6">
                                        Found {retreats.length} retreats. Select which ones to create marketing plans for:
                                    </p>

                                    <div className="space-y-3 max-h-96 overflow-y-auto">
                                        {retreats.map(retreat => (
                                            <label key={retreat.id} className="flex items-start space-x-3 p-4 border rounded-lg hover:bg-gray-50 cursor-pointer">
                                                <input
                                                    type="checkbox"
                                                    checked={selectedRetreats.includes(retreat.id)}
                                                    onChange={(e) => {
                                                        if (e.target.checked) {
                                                            setSelectedRetreats([...selectedRetreats, retreat.id]);
                                                        } else {
                                                            setSelectedRetreats(selectedRetreats.filter(id => id !== retreat.id));
                                                        }
                                                    }}
                                                    className="mt-1"
                                                />
                                                <div className="flex-1">
                                                    <div className="font-semibold">{retreat.name}</div>
                                                    <div className="text-sm text-gray-600">
                                                        {retreat.start_date} → {retreat.end_date} | {retreat.location} | {retreat.duration} nights
                                                    </div>
                                                    <span className={`inline-block mt-1 px-2 py-1 rounded text-xs font-medium ${
                                                        retreat.retreat_type === 'Weekend' ? 'bg-blue-100 text-blue-700' :
                                                        retreat.retreat_type === 'Mid-Week' ? 'bg-purple-100 text-purple-700' :
                                                        'bg-orange-100 text-orange-700'
                                                    }`}>
                                                        {retreat.retreat_type}
                                                    </span>
                                                </div>
                                            </label>
                                        ))}
                                    </div>

                                    <div className="flex space-x-4 mt-6">
                                        <button
                                            onClick={() => setStep('scrape')}
                                            className="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-lg hover:bg-gray-300 transition font-semibold"
                                        >
                                            ← Back
                                        </button>
                                        <button
                                            onClick={() => setStep('generate')}
                                            disabled={selectedRetreats.length === 0}
                                            className="flex-1 bg-purple-600 text-white py-3 px-6 rounded-lg hover:bg-purple-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed font-semibold"
                                        >
                                            Continue to Generate →
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Step 3: Generate */}
                        {step === 'generate' && (
                            <div className="max-w-4xl mx-auto">
                                <div className="bg-white rounded-lg shadow-lg p-8">
                                    <h2 className="text-2xl font-bold mb-4">📥 Download CSV</h2>
                                    <p className="text-gray-600 mb-6">
                                        Your marketing plan is ready with {selectedRetreats.length} retreat(s) and {
                                            Object.values(tasks).flat().filter(t => t.enabled !== false).length
                                        } tasks per retreat.
                                    </p>

                                    <div className="bg-green-50 border border-green-200 rounded-lg p-6 mb-6">
                                        <h3 className="font-semibold text-green-900 mb-3">✨ What's included:</h3>
                                        <ul className="text-sm text-green-800 space-y-2">
                                            <li>✅ Milestone markers for each retreat start date</li>
                                            <li>✅ Pre-launch tasks (60-35 days before)</li>
                                            <li>✅ Launch tasks (35-30 days before)</li>
                                            <li>✅ Ongoing promotion tasks</li>
                                            <li>✅ Final push tasks (7 days before)</li>
                                            <li>✅ Post-retreat follow-up tasks</li>
                                        </ul>
                                    </div>

                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-6">
                                        <h3 className="font-semibold text-blue-900 mb-3">📋 Import to Asana:</h3>
                                        <ol className="text-sm text-blue-800 space-y-2 list-decimal list-inside">
                                            <li>Go to your Asana project</li>
                                            <li>Click the dropdown menu (top right) → Import → CSV</li>
                                            <li>Upload the downloaded CSV file</li>
                                            <li>Map columns: Name→Name, Start Date→Start Date, End Date→Due Date, Notes→Notes, Tags→Tags</li>
                                            <li>Click Import</li>
                                        </ol>
                                    </div>

                                    <button
                                        onClick={downloadCSV}
                                        className="w-full bg-purple-600 text-white py-4 px-6 rounded-lg hover:bg-purple-700 transition font-semibold text-lg mb-4"
                                    >
                                        📥 Download CSV for Asana
                                    </button>

                                    <button
                                        onClick={() => {
                                            setStep('scrape');
                                            setRetreats([]);
                                            setSelectedRetreats([]);
                                        }}
                                        className="w-full bg-gray-200 text-gray-700 py-3 px-6 rounded-lg hover:bg-gray-300 transition font-semibold"
                                    >
                                        ↺ Start Over
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
