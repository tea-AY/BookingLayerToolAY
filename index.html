            'EXPLORE': 'bg-blue-500 text-white',

        function App() {
            const [step, setStep] = useState('customize'); // Skip connect step since we have data
            const [retreats, setRetreats] = useState(ADVENTURE_YOGI_RETREATS);
            const [selectedRetreats, setSelectedRetreats] = useState(ADVENTURE_YOGI_RETREATS.map(r => r.id));
            const [tasks, setTasks] = useState(DEFAULT_TASKS);
            const [error, setError] = useState('');

            useEffect(() => {
                // Filter retreats to only show future dates
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                const futureRetreats = ADVENTURE_YOGI_RETREATS.filter(retreat => {
                    const startDate = new Date(retreat.start_date);
                    return startDate >= today;
                });
                
                setRetreats(futureRetreats);
                setSelectedRetreats(futureRetreats.map(r => r.id));
            }, []);

            const updateRetreatDetails = (retreatId, field, value) => {
                setRetreats(prev => prev.map(retreat => 
                    retreat.id === retreatId 
                        ? { ...retreat, [field]: value }
                        : retreat
                ));
            };

            const toggleTask = (category, taskId) => {
                setTasks(prev => ({
                    ...prev,
                    [category]: prev[category].map(task =>
                        task.id === taskId ? { ...task, enabled: !task.enabled } : task
                    )
                }));
            };

            const updateTask = (category, taskId, field, value) => {
                setTasks(prev => ({
                    ...prev,
                    [category]: prev[category].map(task =>
                        task.id === taskId ? { ...task, [field]: value } : task
                    )
                }));
            };

            const addTask = (category) => {
                const newTask = {
                    id: `custom_${Date.now()}`,
                    name: "📝 New Custom Task",
                    channels: ['Instagram'],
                    days_before: category === 'post_retreat' ? undefined : 30,
                    days_after: category === 'post_retreat' ? 7 : undefined,
                    description: "Add task description here...",
                    pillar: 'EXPLORE',
                    enabled: true,
                    custom: true
                };
                
                setTasks(prev => ({
                    ...prev,
                    [category]: [...prev[category], newTask]
                }));
            };

            const removeTask = (category, taskId) => {
                setTasks(prev => ({
                    ...prev,
                    [category]: prev[category].filter(task => task.id !== taskId)
                }));
            };

            const generateCSV = () => {
                let csv = 'Task Name,Start Date,Due Date,Notes,Tags\n';
                
                selectedRetreats.forEach(retreatId => {
                    const retreat = retreats.find(r => r.id === retreatId);
                    if (!retreat) return;

                    const startDate = new Date(retreat.start_date);
                    const endDate = new Date(retreat.end_date);

                    // Milestone
                    const milestoneNotes = `Retreat: ${retreat.name} | ${retreat.location} | ${retreat.retreat_type} (${retreat.duration} days) | ${retreat.start_date} to ${retreat.end_date}`;
                    csv += `"🧘 ${retreat.name} - ${retreat.location}","${formatDate(startDate)}","${formatDate(startDate)}","${milestoneNotes}","milestone,retreat,${retreat.retreat_type}"\n`;

                    // Add tasks
                    Object.entries(tasks).forEach(([category, taskList]) => {
                        taskList.forEach(task => {
                            if (task.enabled === false) return;

                            let dueDate;
                            if (task.days_before !== undefined) {
                                dueDate = new Date(startDate);
                                dueDate.setDate(dueDate.getDate() - task.days_before);
                            } else if (task.days_after !== undefined) {
                                dueDate = new Date(endDate);
                                dueDate.setDate(dueDate.getDate() + task.days_after);
                            } else {
                                dueDate = startDate;
                            }

                            const channels = task.channels.join(', ');
                            const notes = `${retreat.name} - ${retreat.location} (${retreat.retreat_type}) | ${task.description} | Channels: ${channels} | Pillar: ${task.pillar}`;
                            const tags = `${retreat.name},${retreat.location},${task.pillar},${category},${retreat.retreat_type}`;

                            csv += `"${task.name}","${formatDate(startDate)}","${formatDate(dueDate)}","${notes}","${tags}"\n`;
                        });
                    });
                });

                return csv;
            };

            const downloadCSV = () => {
                const csv = generateCSV();
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `adventure-yogi-retreats-${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            };

            const formatDate = (date) => {
                return date.toISOString().split('T')[0];
            };

            const formatDisplayDate = (dateStr) => {
                const date = new Date(dateStr);
                return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            };

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <div className="gradient-bg text-white py-8 px-4">
                        <div className="max-w-7xl mx-auto">
                            <h1 className="text-4xl font-bold mb-2">🧘 Adventure Yogi</h1>
                            <p className="text-xl opacity-90">Retreat Marketing Planner</p>
                            <div className="bg-white bg-opacity-20 rounded-lg p-4 mt-4">
                                <p className="text-sm">
                                    📅 Loaded {retreats.length} upcoming retreats from your calendar
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Progress Steps */}
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        <div className="flex items-center justify-center space-x-4 mb-8">
                            <Step number="1" label="Select Retreats" active={step === 'customize'} completed={step === 'generate'} />
                            <div className="w-16 h-1 bg-gray-300"></div>
                            <Step number="2" label="Customize Tasks" active={step === 'customize'} />
                            <div className="w-16 h-1 bg-gray-300"></div>
                            <Step number="3" label="Generate" active={step === 'generate'} />
                        </div>

                        {/* Step 1 & 2: Select & Customize */}
                        {step === 'customize' && (
                            <div>
                                {/* Retreat Selection & Editing */}
                                <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                                    <h2 className="text-2xl font-bold mb-4">Select & Edit Retreats</h2>
                                    <div className="flex justify-between items-center mb-4">
                                        <div>
                                            <span className="text-lg font-medium text-purple-600">
                                                Found {retreats.length} upcoming retreat{retreats.length !== 1 ? 's' : ''}
                                            </span>
                                            <span className="text-gray-600 ml-2">
                                                ({selectedRetreats.length} selected)
                                            </span>
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => setSelectedRetreats(retreats.map(r => r.id))}
                                                className="text-sm px-3 py-1 border border-purple-600 text-purple-600 rounded hover:bg-purple-50"
                                            >
                                                Select All
                                            </button>
                                            <button
                                                onClick={() => setSelectedRetreats([])}
                                                className="text-sm px-3 py-1 border border-gray-300 text-gray-600 rounded hover:bg-gray-50"
                                            >
                                                Clear All
                                            </button>
                                        </div>
                                    </div>
                                    
                                    {retreats.length === 0 ? (
                                        <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-3 rounded">
                                            <p className="font-medium">No upcoming retreats found</p>
                                            <p className="text-sm mt-1">Make sure you have retreats scheduled starting from today or in the future.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 gap-4">
                                            {retreats.map(retreat => (
                                                <RetreatCard
                                                    key={retreat.id}
                                                    retreat={retreat}
                                                    isSelected={selectedRetreats.includes(retreat.id)}
                                                    onSelect={(selected) => {
                                                        if (selected) {
                                                            setSelectedRetreats([...selectedRetreats, retreat.id]);
                                                        } else {
                                                            setSelectedRetreats(selectedRetreats.filter(id => id !== retreat.id));
                                                        }
                                                    }}
                                                    onUpdate={(field, value) => updateRetreatDetails(retreat.id, field, value)}
                                                    formatDisplayDate={formatDisplayDate}
                                                />
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <TaskCustomizer tasks={tasks} setTasks={setTasks} addTask={addTask} removeTask={removeTask} updateTask={updateTask} toggleTask={toggleTask} />

                                <div className="flex justify-end mt-8">
                                    <button
                                        onClick={() => setStep('generate')}
                                        disabled={selectedRetreats.length === 0}
                                        className="px-6 py-3 bg-purple-600 text-white rounded-lg font-medium hover:bg-purple-700 disabled:opacity-50"
                                    >
                                        Continue to Generate →
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Step 3: Generate CSV */}
                        {step === 'generate' && (
                            <div className="max-w-4xl mx-auto">
                                <div className="bg-white rounded-lg shadow-lg p-8">
                                    <h2 className="text-2xl font-bold mb-4">🎉 Ready to Generate!</h2>
                                    
                                    <div className="bg-purple-50 border border-purple-200 rounded-lg p-6 mb-6">
                                        <h3 className="font-bold text-lg mb-3">Summary</h3>
                                        <div className="space-y-2 text-gray-700">
                                            <div>📅 <strong>{selectedRetreats.length}</strong> retreat{selectedRetreats.length !== 1 ? 's' : ''} selected</div>
                                            <div>✅ <strong>{Object.values(tasks).flat().filter(t => t.enabled !== false).length}</strong> marketing tasks per retreat</div>
                                            <div>📊 <strong>{selectedRetreats.length * Object.values(tasks).flat().filter(t => t.enabled !== false).length}</strong> total tasks will be created</div>
                                            <div className="text-sm text-gray-600 mt-3 pt-3 border-t">
                                                Retreats: {(() => {
                                                    const types = retreats.filter(r => selectedRetreats.includes(r.id))
                                                        .reduce((acc, r) => {
                                                            acc[r.retreat_type] = (acc[r.retreat_type] || 0) + 1;
                                                            return acc;
                                                        }, {});
                                                    return Object.entries(types).map(([type, count]) => `${count} ${type}`).join(', ');
                                                })()}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mb-6">
                                        <h3 className="font-bold mb-3">CSV Import Instructions</h3>
                                        <div className="bg-gray-50 rounded-lg p-4 space-y-2 text-sm text-gray-600">
                                            <p>1. Download the CSV file below</p>
                                            <p>2. Open Asana and go to your project</p>
                                            <p>3. Click the "..." menu → Import → CSV</p>
                                            <p>4. Upload the file and map columns:</p>
                                            <ul className="ml-6 list-disc space-y-1">
                                                <li>Task Name → Name</li>
                                                <li>Due Date → Due Date</li>
                                                <li>Notes → Description</li>
                                                <li>Tags → Tags</li>
                                            </ul>
                                        </div>
                                    </div>

                                    <button
                                        onClick={downloadCSV}
                                        className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-4 px-6 rounded-lg font-bold text-lg hover:shadow-lg transition"
                                    >
                                        📥 Download CSV for Asana
                                    </button>

                                    <div className="flex justify-between mt-8">
                                        <button
                                            onClick={() => setStep('customize')}
                                            className="px-6 py-3 border border-gray-300 rounded-lg font-medium hover:bg-gray-50"
                                        >
                                            ← Back to Customize
                                        </button>
                                        <button
                                            onClick={() => {
                                                setStep('customize');
                                                setSelectedRetreats(retreats.map(r => r.id));
                                                setTasks(DEFAULT_TASKS);
                                            }}
                                            className="px-6 py-3 text-purple-600 font-medium hover:underline"
                                        >
                                            Start Over
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function RetreatCard({ retreat, isSelected, onSelect, onUpdate, formatDisplayDate }) {
            const [isEditing, setIsEditing] = useState(false);

            return (
                <div className={`border rounded-lg p-4 transition ${isSelected ? 'border-purple-500 bg-purple-50' : 'border-gray-200 hover:border-purple-300'}`}>
                    <div className="flex items-start justify-between">
                        <label className="flex items-start cursor-pointer flex-1">
                            <input
                                type="checkbox"
                                checked={isSelected}
                                onChange={(e) => onSelect(e.target.checked)}
                                className="mt-1 mr-3"
                            />
                            <div className="flex-1">
                                {isEditing ? (
                                    <div className="space-y-3">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Retreat Name</label>
                                            <input
                                                type="text"
                                                value={retreat.name}
                                                onChange={(e) => onUpdate('name', e.target.value)}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Location</label>
                                            <input
                                                type="text"
                                                value={retreat.location}
                                                onChange={(e) => onUpdate('location', e.target.value)}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500"
                                                placeholder="e.g., Cornwall, Sri Lanka, Costa Rica"
                                            />
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                                                <input
                                                    type="date"
                                                    value={retreat.start_date}
                                                    onChange={(e) => onUpdate('start_date', e.target.value)}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                                                <input
                                                    type="date"
                                                    value={retreat.end_date}
                                                    onChange={(e) => onUpdate('end_date', e.target.value)}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-purple-500 focus:border-purple-500"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="font-medium text-lg">{retreat.name}</div>
                                        <div className="text-gray-600">{retreat.location}</div>
                                        <div className="flex items-center gap-2 mt-2">
                                            <span className="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded">
                                                {retreat.retreat_type}
                                            </span>
                                            <span className="text-xs text-gray-500">
                                                {retreat.duration} days
                                            </span>
                                        </div>
                                        <div className="text-sm text-gray-500 mt-1">
                                            {formatDisplayDate(retreat.start_date)} - {formatDisplayDate(retreat.end_date)}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </label>
                        <button
                            onClick={() => setIsEditing(!isEditing)}
                            className="ml-3 text-sm text-purple-600 hover:text-purple-700 p-2"
                        >
                            {isEditing ? '✓' : '✏️'}
                        </button>
                    </div>
                </div>
            );
        }

        function Step({ number, label, active, completed }) {
            return (
                <div className="flex flex-col items-center">
                    <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold ${
                        active ? 'bg-purple-600 text-white' : 
                        completed ? 'bg-green-500 text-white' : 
                        'bg-gray-200 text-gray-500'
                    }`}>
                        {completed ? '✓' : number}
                    </div>
                    <div className={`mt-2 text-sm font-medium ${active ? 'text-purple-600' : 'text-gray-500'}`}>
                        {label}
                    </div>
                </div>
            );
        }

        function TaskCustomizer({ tasks, setTasks, addTask, removeTask, updateTask, toggleTask }) {
            const [expandedCategory, setExpandedCategory] = useState('pre_launch');

            const categories = {
                pre_launch: { title: 'Pre-Launch Tasks', subtitle: '60-35 days before', emoji: '🚀' },
                promotional: { title: 'Promotional Tasks', subtitle: '30-14 days before', emoji: '📢' },
                pre_retreat: { title: 'Pre-Retreat Tasks', subtitle: '28-7 days before', emoji: '✈️' },
                during_retreat: { title: 'During Retreat', subtitle: 'On-site content', emoji: '🎬' },
                post_retreat: { title: 'Post-Retreat Tasks', subtitle: '3-21 days after', emoji: '💌' }
            };

            return (
                <div className="bg-white rounded-lg shadow-lg p-6">
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h2 className="text-2xl font-bold">Customize Marketing Tasks</h2>
                            <p className="text-gray-600">Add, edit, or remove tasks for each phase</p>
                        </div>
                        <div className="text-right">
                            <div className="text-2xl font-bold text-purple-600">
                                {Object.values(tasks).flat().filter(t => t.enabled !== false).length}
                            </div>
                            <div className="text-sm text-gray-600">Active Tasks</div>
                        </div>
                    </div>

                    {Object.entries(categories).map(([key, cat]) => (
                        <div key={key} className="mb-4 border rounded-lg">
                            <button
                                onClick={() => setExpandedCategory(expandedCategory === key ? null : key)}
                                className="w-full px-6 py-4 flex justify-between items-center hover:bg-gray-50"
                            >
                                <div className="flex items-center gap-3">
                                    <span className="text-2xl">{cat.emoji}</span>
                                    <div className="text-left">
                                        <div className="font-bold">{cat.title}</div>
                                        <div className="text-sm text-gray-500">{cat.subtitle}</div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-sm font-medium">
                                        {tasks[key].filter(t => t.enabled !== false).length} tasks
                                    </span>
                                    <span className="text-gray-400">
                                        {expandedCategory === key ? '▼' : '▶'}
                                    </span>
                                </div>
                            </button>

                            {expandedCategory === key && (
                                <div className="px-6 py-4 bg-gray-50 space-y-3">
                                    {tasks[key].map(task => (
                                        <TaskCard
                                            key={task.id}
                                            task={task}
                                            category={key}
                                            onToggle={() => toggleTask(key, task.id)}
                                            onUpdate={(field, value) => updateTask(key, task.id, field, value)}
                                            onRemove={() => removeTask(key, task.id)}
                                        />
                                    ))}
                                    
                                    <button
                                        onClick={() => addTask(key)}
                                        className="w-full py-3 border-2 border-dashed border-gray-300 rounded-lg text-gray-500 hover:border-purple-500 hover:text-purple-500 font-medium"
                                    >
                                        + Add Custom Task
                                    </button>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        }

        function TaskCard({ task, category, onToggle, onUpdate, onRemove }) {
            const [isEditing, setIsEditing] = useState(false);

            return (
                <div className={`task-card bg-white rounded-lg p-4 border-2 ${task.enabled === false ? 'opacity-50 border-gray-200' : 'border-gray-200'}`}>
                    <div className="flex items-start justify-between mb-3">
                        <div className="flex items-start gap-3 flex-1">
                            <input
                                type="checkbox"
                                checked={task.enabled !== false}
                                onChange={onToggle}
                                className="mt-1"
                            />
                            {isEditing ? (
                                <input
                                    type="text"
                                    value={task.name}
                                    onChange={(e) => onUpdate('name', e.target.value)}
                                    className="flex-1 px-2 py-1 border rounded"
                                />
                            ) : (
                                <div className="flex-1 font-medium">{task.name}</div>
                            )}
                        </div>
                        <div className="flex gap-2">
                            <button
                                onClick={() => setIsEditing(!isEditing)}
                                className="text-sm text-purple-600 hover:text-purple-700"
                            >
                                {isEditing ? '✓' : '✏️'}
                            </button>
                            {task.custom && (
                                <button
                                    onClick={onRemove}
                                    className="text-sm text-red-600 hover:text-red-700"
                                >
                                    🗑️
                                </button>
                            )}
                        </div>
                    </div>

                    {isEditing ? (
                        <div className="space-y-3 ml-8">
                            <div>
                                <label className="text-xs font-medium text-gray-600 block mb-1">Description</label>
                                <textarea
                                    value={task.description}
                                    onChange={(e) => onUpdate('description', e.target.value)}
                                    className="w-full px-3 py-2 border rounded text-sm"
                                    rows="2"
                                />
                            </div>
                            
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs font-medium text-gray-600 block mb-1">
                                        {task.days_after !== undefined ? 'Days After Retreat' : 'Days Before Retreat'}
                                    </label>
                                    <input
                                        type="number"
                                        value={task.days_before !== undefined ? task.days_before : task.days_after}
                                        onChange={(e) => onUpdate(task.days_after !== undefined ? 'days_after' : 'days_before', parseInt(e.target.value))}
                                        className="w-full px-3 py-2 border rounded text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs font-medium text-gray-600 block mb-1">Content Pillar</label>
                                    <select
                                        value={task.pillar}
                                        onChange={(e) => onUpdate('pillar', e.target.value)}
                                        className="w-full px-3 py-2 border rounded text-sm"
                                    >
                                        <option value="EXPLORE">EXPLORE</option>
                                        <option value="ALIGN">ALIGN</option>
                                        <option value="SELL">SELL</option>
                                        <option value="ALL">ALL</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="text-xs font-medium text-gray-600 block mb-1">Channels (comma-separated)</label>
                                <input
                                    type="text"
                                    value={task.channels.join(', ')}
                                    onChange={(e) => onUpdate('channels', e.target.value.split(',').map(s => s.trim()))}
                                    className="w-full px-3 py-2 border rounded text-sm"
                                />
                            </div>
                        </div>
                    ) : (
                        <div className="ml-8 space-y-2">
                            <div className="text-sm text-gray-600">{task.description}</div>
                            <div className="flex flex-wrap gap-2">
                                {task.channels.map(channel => (
                                    <span key={channel} className={`pill text-xs ${CHANNEL_COLORS[channel] || 'bg-gray-100 text-gray-600'}`}>
                                        {channel}
                                    </span>
                                ))}
                                <span className={`pill text-xs ${PILLAR_COLORS[task.pillar]}`}>
                                    {task.pillar}
                                </span>
                                <span className="pill text-xs bg-gray-100 text-gray-600">
                                    {task.days_before !== undefined ? `${task.days_before}d before` : `${task.days_after}d after`}
                                </span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
